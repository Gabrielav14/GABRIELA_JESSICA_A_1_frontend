<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <ul class="nav nav-tabs">
            <li class="nav-item">
              <a class="nav-link" href="../Frontend/clientes.html">Clientes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="../Frontend/index.html">Reservas</a>
            </li>
          </ul>
      </nav>


    <section class="card shadow-sm mb-5">
        <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Agregar cliente</h2>
        </div>
        <div class="card-body">
        <form id="formPersona" class="row g-3">
        <input type="hidden" id="txtIdPersona">
        <div class="col-md-4">
        <label for="txtNombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="txtNombre" placeholder="Ejemplo:AnaElizabeth Flores">
        </div>
        <div class="col-md-4">
        <label for="txtCorreo" class="form-label">Correo</label>
        <input type="email" class="form-control" id="txtCorreo" 
       placeholder="ana@email.com">
        </div>
        <div class="col-md-4">
        <label for="txtTelefono" class="form-label">Telefono</label>
        <input type="text" class="form-control" id="txtTelefono" placeholder="7777-7777">
        </div>
        <div class="col-12">
        <button id="btnGuardar" type="submit" class="btn btn-success">
        Guardar Reserva
        </button>
       
    




    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
