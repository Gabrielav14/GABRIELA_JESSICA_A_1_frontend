<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="../Frontend/css/style.css">
   
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <ul class="nav nav-tabs">
            <li class="nav-item">
              <a class="nav-link active" href="../Frontend/clientes.html">Clientes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../Frontend/index.html">Reservas</a>
            </li>
          </ul>
      </nav>

      <main class="container py-5">
        <section class="text-center mb-5">
            <h1 class="fw-bold mb-3">Gestion de Clientes</h1> 

        </section>
        <br>
        <br>
        <div class="main-container p-4 text-center">
            <section class="card-header-bg-primary text-white">
                <h3 class="mb-0"> Agregar o editar Cliente </h3>

        </div>
        <div class="card-body text-center bg-secondary text-white ">
        <form id="formCliente">
            <input type="hidden" id="txtId">
            <div class="row">
                <div class="col-md-4 my-3">
                <label for="txtNombre" class="form-label">Nombre</label>
                <input type="text" id="txtNombre" class="form-label" maxlength="100" required>    
                </div>

                <div class="col-md-4 my-3">
                    <label for="txtApellido" class="form-label">Apellido</label>
                    <input type="text" id="txtApellido" class="form-label" maxlength="100" required>
                </div>

                <div class="col-md-4 my-3">
                    <label for="txtTelefono" class="form-label">Telefono</label>
                    <input type="text" id="txtTelefono" placeholder="7777-7777" class="form-label" maxlength="15" required>
                </div>

                <div class="col-md-6 my-3">
                    <label for="txtEmail" class="form-label">Email</label>
                    <input type="email" id="txtEmail"  placeholder="ana@email.com"  class="form-label" maxlength="100" required>
                </div>

                <div class="col-md-6 my-3">
                    <label for="txtDireccion" class="form-label">Direccion</label>
                    <input type="text" id="txtDireccion" class="form-label" maxlength="200" required>
                </div>
            </div>
            <button type="button" id="btnGuardar" class="btn-success btn-lg"> Guardar Cliente</button>
            <button type="button" id="btnCancelar" class="btn-warning btn-lg d-one">Cancelar </button>
        </form>    
        </div>
    </section>

        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h2 class="mb-0"> Lista de Clientes</h2>
                    <button id="btnRecargar" class="btn btn-light btn-sm">Recargar </button>
            </div>
            <div class="card-body">
                <div id="mensaje" class="alert d-none" role="alert"></div>
                <div id="cargando" class="text-center py-5" role="alert"></div>
                <div class="spinner-border text-primary" role="status"></div>
            </div>
            <div class="table-responsive d-none" id="tableroContainer">
             <table class="table table-striped table-hover aligb-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Telefono</th>
                        <th>Email</th>
                        <th>Direccion</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes"></tbody>
             </table>    
            </div>
        </section>


    </main>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script type="module" src="../i. Frontend/js/controller/clientesController.js"></script>
</body>
</html>
